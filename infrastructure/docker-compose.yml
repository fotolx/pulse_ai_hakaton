services:
  # ============================================================
  # PostgreSQL + TimescaleDB
  # ============================================================
  timescaledb:
    build:
      context: ./timescaledb
    container_name: my_timescaledb
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TIMESCALEDB_TELEMETRY: off
    ports:
      - "5432:5432"
    volumes:
      - ./timescale_data:/var/lib/postgresql/data
    shm_size: 1gb
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # pgBouncer (edoburu — самый надёжный образ)
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: my_pgbouncer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${DJANGO_DB_USER}:${DJANGO_DB_PASSWORD}@timescaledb:5432/${POSTGRES_DB}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      RESERVE_POOL_TIMEOUT: "3"
      SERVER_IDLE_TIMEOUT: "60"
      SERVER_LIFETIME: "3600"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    ports:
      - "6432:6432"
    networks:
      - backend

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: my_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # CELERY WORKER
  # ============================================================
  celery_worker:
    image: python:3.12-slim-bookworm
    container_name: my_celery_worker
    restart: unless-stopped
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends libpq5 gcc &&
               pip install --no-cache-dir -r /app/requirements.txt &&
               celery -A main worker -l info -c 4 --pool=prefork"
    env_file:
      - ../.env
    environment:
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 6432
      DATABASE_DIRECT_HOST: timescaledb
      DATABASE_DIRECT_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      DJANGO_SETTINGS_MODULE: main.settings
    volumes:
      - ../pulse_ai:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # CELERY BEAT
  # ============================================================
  celery_beat:
    image: python:3.12-slim-bookworm
    container_name: my_celery_beat
    restart: unless-stopped
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends libpq5 gcc &&
               pip install --no-cache-dir -r /app/requirements.txt &&
               celery -A main beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    env_file:
      - ../.env
    environment:
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 6432
      DATABASE_DIRECT_HOST: timescaledb
      DATABASE_DIRECT_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      DJANGO_SETTINGS_MODULE: main.settings
    volumes:
      - ../pulse_ai:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - backend

  # ============================================================
  # FLOWER (мониторинг Celery)
  # ============================================================
  celery_flower:
    # image: python:3.12-slim-bookworm
    image: mher/flower:latest
    container_name: my_celery_flower
    restart: unless-stopped
    # command: >
    #   bash -c "pip install --no-cache-dir celery flower redis &&
    #            celery -A config flower --port=5555"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      # CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
volumes:
  init_generated:

networks:
  backend:
    driver: bridge