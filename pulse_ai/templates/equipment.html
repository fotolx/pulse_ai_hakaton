{% load static %}
<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Реестр оборудования, показания датчиков и прогнозы">
  <title>Реестр оборудования — Инженерные коллекторы Москвы</title>
  <link rel="icon" type="image/png" href="{% static 'img/icons/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'css/normalize.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static '/css/pages/equipment.css' %}">
  <script defer src="{% static 'vendor/anychart/anychart-base.min.js' %}"></script>
  <script type="module" src="{% static 'js/app.js' %}"></script>
</head>

<body data-page="equipment">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <div class="container" id="header-root"></div>
  <main class="workspace container" id="main" tabindex="-1"></main>
  <dialog class="notice" id="notice" aria-labelledby="notice-title">
    <form method="dialog">
      <h2 class="notice__title" id="notice-title"></h2>
      <p class="notice__text" id="notice-text"></p>
      <button class="notice__close" autofocus>Закрыть</button>
    </form>
  </dialog>
</body>

</html>
